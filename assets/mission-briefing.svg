<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f2e"/><stop offset="1" stop-color="#120d33"/>
  </linearGradient>
  <linearGradient id="cell" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <clipPath id="round"><rect width="900" height="360" rx="16"/></clipPath>
  <style>
  .tw{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{animation:bl 1.4s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .pulse{animation:pu 2s ease-in-out infinite}
  @keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
  .spin{transform-box:fill-box;transform-origin:center;animation:sp 30s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</defs>
